<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Commands Game — Basic English Grammar for Kids</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Rounded', system-ui, sans-serif; background: #FFF7E8; color: #263238; min-height: 100vh; }
  header { background: #0E7C86; color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; }
  header .ttl { font-weight: 800; font-size: 19px; letter-spacing: .3px; }
  header .pill { background: #FFD93B; color: #14343C; border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 13px; border: 2px solid #14343C; }
  header .sp { flex: 1; }
  .scorebox { background: #fff; color: #B8860B; font-weight: 800; border-radius: 999px; padding: 4px 12px; font-size: 16px; }
  .tgl { background: #ffffff2b; border: 2px solid #ffffff88; color: #fff; border-radius: 999px; font-size: 18px; padding: 3px 11px; cursor: pointer; }
  .tgl.off { opacity: .45; filter: grayscale(1); }
  main { max-width: 760px; margin: 0 auto; padding: 14px; }
  .stagebar { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
  .stagebar span { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #E0E7EA; color: #546E7A; }
  .stagebar span.on { background: #0E7C86; color: #fff; }
  .stagebar span.done { background: #BFE8C8; color: #14532A; }
  .hostrow { display: flex; gap: 12px; align-items: flex-start; }
  .host-frame { position: relative; width: 168px; flex: none; border-radius: 18px; background: #FDF3E3; padding: 6px; box-shadow: 0 3px 10px #0000001c; }
  .host-frame .imgwrap { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 3/2; }
  .host-frame img { width: 100%; height: 100%; object-fit: contain; display: block; background: #FDF6EC; }
  .mouth { position: absolute; left: 46.4%; top: 34.6%; width: 6.4%; height: 4.6%; background: #8E3B2F; border-radius: 50%; opacity: 0; transform-origin: center; pointer-events: none; }
  .host-frame.speaking .mouth { opacity: .85; animation: talk .16s infinite alternate ease-in-out; }
  @keyframes talk { from { transform: scaleY(.25); } to { transform: scaleY(1.15); } }
  .host-frame.g-wave { animation: wave 1.1s ease-in-out 2; }
  @keyframes wave { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-2.6deg); } 75% { transform: rotate(2.6deg); } }
  .host-frame.g-nod { animation: nod .5s ease-in-out 2; }
  @keyframes nod { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
  .host-frame.g-cheer { animation: cheer .55s ease-in-out 2; }
  @keyframes cheer { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-11px); } }
  .bubble { flex: 1; background: #fff; border: 3px solid #0E7C86; border-radius: 18px; padding: 12px 14px; font-size: 19px; line-height: 1.4; min-height: 86px; position: relative; box-shadow: 0 3px 10px #00000012; }
  .bubble:before { content: ''; position: absolute; left: -15px; top: 30px; border: 8px solid transparent; border-right: 10px solid #0E7C86; }
  .bubble .who { font-size: 12px; font-weight: 800; letter-spacing: 1.2px; color: #0E7C86; }
  .panel { margin-top: 14px; background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 3px 12px #00000014; }
  .bigbtn { display: inline-block; background: #C2185B; color: #fff; border: none; font-family: inherit; font-weight: 800; font-size: 22px; padding: 13px 30px; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 0 #7E0E3B; }
  .bigbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7E0E3B; }
  .bigbtn.dim { opacity: .45; pointer-events: none; }
  .center { text-align: center; }
  .startart { display: flex; gap: 10px; justify-content: center; align-items: flex-end; margin: 8px 0 4px; }
  .startart img.z { width: 210px; border-radius: 16px; background: #FDF3E3; padding: 5px; }
  .startart img.k { width: 170px; border-radius: 16px; background: #EFF8EE; padding: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .wcard { width: calc(50% - 6px); max-width: 240px; background: #FFFDF7; border: 3px solid #90A4AE; border-radius: 16px; padding: 10px 8px; cursor: pointer; text-align: center; font-family: inherit; }
  .wcard .pic { height: 92px; margin-bottom: 6px; }
  .wcard .pic img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
  .wcard .w { font-size: 25px; font-weight: 800; color: #263238; }
  .wcard.nopic { width: auto; min-width: 118px; padding: 12px 18px; }
  .wcard:active { transform: scale(.97); }
  .wcard.right { border-color: #2E8B45; background: #E8F9EC; box-shadow: 0 0 0 4px #2E8B4555; }
  .wcard.wrong { border-color: #C9A227; background: #FFF6D6; animation: wiggle .35s ease-in-out; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-2.5deg); } 70% { transform: rotate(2.5deg); } }
  .opts2 { display: flex; flex-wrap: wrap; gap: 12px; }
  .optbtn { width: calc(50% - 6px); background: #FFFDF7; border: 3px solid #90A4AE; border-radius: 14px; padding: 12px; font-family: inherit; font-size: 20px; font-weight: 700; cursor: pointer; text-align: left; }
  .optbtn b { color: #C2185B; margin-right: 6px; }
  .optbtn.right { border-color: #2E8B45; background: #E8F9EC; }
  .optbtn.wrong { border-color: #C9A227; background: #FFF6D6; animation: wiggle .35s ease-in-out; }
  .sortcard { text-align: center; margin-bottom: 14px; }
  .sortcard .bigword { display: inline-block; font-size: 38px; font-weight: 800; background: #FFF3C4; border: 3px dashed #B8860B; border-radius: 16px; padding: 8px 30px; }
  .boxes { display: flex; flex-wrap: wrap; gap: 10px; }
  .sbox { width: calc(50% - 5px); border: 3px solid; border-radius: 16px; padding: 12px 10px; cursor: pointer; font-family: inherit; color: #fff; font-size: 20px; font-weight: 800; letter-spacing: 1px; }
  .sbox small { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0; opacity: .92; margin-top: 2px; }
  .sbox.right { box-shadow: 0 0 0 5px #2E8B4566; filter: brightness(1.12); }
  .sbox.wrong { animation: wiggle .35s ease-in-out; filter: brightness(.92); }
  .scenewrap { border-radius: 16px; background: #EAF6EC; padding: 7px; margin-bottom: 14px; }
  .scenewrap img { width: 100%; display: block; border-radius: 10px; object-fit: contain; }
  .showntext { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 14px; line-height: 1.35; }
  .showntext .blank { color: #C2185B; letter-spacing: 2px; }
  .qtext { font-size: 22px; font-weight: 800; margin-bottom: 14px; }
  .qnum { display: inline-block; background: #C2185B; color: #fff; border-radius: 50%; width: 32px; height: 32px; text-align: center; line-height: 32px; font-size: 17px; margin-right: 8px; }
  .orderstrip { min-height: 54px; border: 3px dashed #90A4AE; border-radius: 14px; padding: 8px 10px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .orderstrip .placed { background: #E8F9EC; border: 2px solid #2E8B45; color: #14532A; border-radius: 10px; padding: 6px 12px; font-weight: 800; font-size: 18px; }
  .orderstrip .hint { color: #90A4AE; font-weight: 700; font-size: 16px; }
  .ochip { background: #FFFDF7; border: 3px solid #0E7C86; color: #0E4A73; border-radius: 12px; padding: 10px 14px; font-family: inherit; font-size: 19px; font-weight: 800; cursor: pointer; }
  .ochip.placed { opacity: .28; pointer-events: none; }
  .ochip.wrong { border-color: #C9A227; background: #FFF6D6; animation: wiggle .35s ease-in-out; }
  .endstars { font-size: 52px; letter-spacing: 6px; color: #E8A90C; text-shadow: 0 2px 0 #B8860B; }
  .endscore { font-size: 27px; font-weight: 800; margin: 6px 0; }
  .endline { font-size: 21px; color: #0E7C86; font-weight: 800; }
  .credit { text-align: center; color: #8A6508; font-size: 13px; margin: 16px 0 6px; letter-spacing: 1px; font-weight: 700; }
  .starburst { position: fixed; font-size: 40px; color: #E8A90C; pointer-events: none; z-index: 50; animation: burst .8s ease-out forwards; }
  @keyframes burst { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6) translateY(-46px); opacity: 0; } }
  @media (max-width: 560px) { .host-frame { width: 128px; } .bubble { font-size: 17px; min-height: 76px; } .startart img.z { width: 150px; } .startart img.k { width: 122px; } .optbtn { width: 100%; } }
</style>
</head>
<body>
<header>
  <span class="pill">Topic 25</span>
  <span class="ttl">Commands Game</span>
  <span class="sp"></span>
  <span class="scorebox">★ <span id="score">0</span> / 21</span>
  <button class="tgl" id="musicTgl" title="Music on/off">🎵</button>
  <button class="tgl" id="voiceTgl" title="Voice on/off">🗣️</button>
</header>
<main>
  <div class="stagebar" id="stagebar"></div>
  <div class="hostrow" id="hostrow" style="display:none">
    <div class="host-frame" id="hostframe"><div class="imgwrap"><img src="img/zara.jpg" alt="Miss Zara"><div class="mouth"></div></div></div>
    <div class="bubble"><div class="who">MISS ZARA</div><div id="bubbletext">Hello!</div></div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="credit">✦ Prepared by: Zulfiqar Ali Sajid ✦</div>
</main>
<script>
"use strict";
const DATA = {"maxScore": 21, "topicName": "Telling Someone to Do Something", "coreLine": "Listen to Miss Zara! Stand up. Sit down. Open your book!", "outcome": "Now I can give and follow commands!", "stages": [{"kind": "choice", "name": "Matching", "variant": "opts", "rounds": [{"say": "Stand up.", "shown": "Stand up.", "opts": [{"t": "Omar sits down.", "img": null}, {"t": "Omar stands up.", "img": null}, {"t": "Omar listens.", "img": null}, {"t": "Omar is quiet.", "img": null}], "key": 1}, {"say": "Sit down.", "shown": "Sit down.", "opts": [{"t": "Omar sits down.", "img": null}, {"t": "Omar opens his book.", "img": null}, {"t": "Omar stands up.", "img": null}, {"t": "Omar looks at Miss Zara.", "img": null}], "key": 0}, {"say": "Open your book.", "shown": "Open your book.", "opts": [{"t": "Omar listens.", "img": null}, {"t": "Omar is quiet.", "img": null}, {"t": "Omar opens his book.", "img": null}, {"t": "Omar sits down.", "img": null}], "key": 2}, {"say": "Look at me.", "shown": "Look at me.", "opts": [{"t": "Omar stands up.", "img": null}, {"t": "Omar looks at Miss Zara.", "img": null}, {"t": "Omar listens.", "img": null}, {"t": "Omar opens his book.", "img": null}], "key": 1}, {"say": "Which word goes with Listen.?", "shown": null, "opts": [{"t": "Omar is quiet.", "img": null}, {"t": "Omar sits down.", "img": null}, {"t": "Omar stands up.", "img": null}, {"t": "Omar listens.", "img": null}], "key": 3}, {"say": "Be quiet.", "shown": "Be quiet.", "opts": [{"t": "Omar is quiet.", "img": null}, {"t": "Omar listens.", "img": null}, {"t": "Omar opens his book.", "img": null}, {"t": "Omar looks at Miss Zara.", "img": null}], "key": 0}]}, {"kind": "choice", "name": "Word Hunt", "variant": "cards", "rounds": [{"say": "Tap the word: Stand up..", "opts": [{"t": "Stand up.", "img": null}, {"t": "Omar is happy.", "img": null}, {"t": "Lily has a book.", "img": null}, {"t": "The cat is small.", "img": null}], "key": 0}, {"say": "Tap the word: Sit down..", "opts": [{"t": "They play in the park.", "img": null}, {"t": "Sit down.", "img": null}, {"t": "Omar is happy.", "img": null}, {"t": "The cat is small.", "img": null}], "key": 1}, {"say": "Tap the word: Open your book..", "opts": [{"t": "Lily has a book.", "img": null}, {"t": "The cat is small.", "img": null}, {"t": "Open your book.", "img": null}, {"t": "Omar is happy.", "img": null}], "key": 2}, {"say": "Tap the word: Be quiet..", "opts": [{"t": "Be quiet.", "img": null}, {"t": "They play in the park.", "img": null}, {"t": "Lily has a book.", "img": null}, {"t": "Omar is happy.", "img": null}], "key": 0}, {"say": "Tap the word: Listen..", "opts": [{"t": "The cat is small.", "img": null}, {"t": "Listen.", "img": null}, {"t": "They play in the park.", "img": null}, {"t": "Lily has a book.", "img": null}], "key": 1}, {"say": "Tap the word: Look at me..", "opts": [{"t": "Omar is happy.", "img": null}, {"t": "Lily has a book.", "img": null}, {"t": "Look at me.", "img": null}, {"t": "The cat is small.", "img": null}], "key": 2}]}, {"kind": "order", "name": "Put in Order", "say": "Put them in the right order. Tap them one by one.", "items": ["Sit down.", "Open your book.", "Look at the picture.", "Read the words."], "shuffled": ["Look at the picture.", "Read the words.", "Sit down.", "Open your book."]}], "quiz": [{"key": 1, "opts": ["Omar is happy.", "Stand up.", "Lily has a book.", "The cat is small."], "q": "Which one is a command?"}, {"key": 2, "opts": ["Opens", "Opened", "Open", "Opening"], "q": "Miss Zara says: \"___ your book.\""}, {"key": 0, "opts": ["Sit down.", "He sits down.", "Omar is sitting.", "The boy is happy."], "q": "Which one is a command?"}, {"key": 3, "opts": ["see", "eat", "sleep", "do"], "q": "A command tells someone to ___ something."}, {"key": 2, "opts": ["Listen.", "Be quiet.", "Lily listens.", "Stand up."], "q": "Which one is NOT a command?"}]};
/* ================= LOCKED HOUSE STANDARDS ================= */
const RATE = 0.85;                 /* speech rate — LOCKED at 0.85 */
const MAXSCORE = DATA.maxScore;
window.__RATE = RATE;              /* test hook */
window.__MAXSCORE = MAXSCORE;

let score = 0, voiceOn = true, musicOn = true;
window.__game = { get score() { return score; } };
const $ = s => document.querySelector(s);
const panel = $('#panel'), bubble = $('#bubbletext'), hostframe = $('#hostframe');

const stageNames = ['Start'].concat(DATA.stages.map(s => s.name),
  DATA.quiz.length ? ['Miss Zara Asks'] : [], ['Finish']);
$('#stagebar').innerHTML = stageNames.map((n, i) => `<span data-s="${i}">${n}</span>`).join('');
function setStage(n) {
  document.querySelectorAll('#stagebar span').forEach(sp => {
    const s = +sp.dataset.s;
    sp.className = s === n ? 'on' : (s < n ? 'done' : '');
  });
}
function setBubble(t) { bubble.textContent = t; }
function gesture(name) {
  hostframe.classList.remove('g-wave', 'g-nod', 'g-cheer');
  void hostframe.offsetWidth;
  if (name) hostframe.classList.add('g-' + name);
}
function updateScore() { $('#score').textContent = score; }
function starBurst(el) {
  const r = el.getBoundingClientRect();
  const s = document.createElement('div');
  s.className = 'starburst'; s.textContent = '★';
  s.style.left = (r.left + r.width / 2 - 20) + 'px'; s.style.top = (r.top - 8) + 'px';
  document.body.appendChild(s); setTimeout(() => s.remove(), 850);
}

/* ================= SPEECH ENGINE — Standard 13 =================
   FIFO queue (no cancel-on-speak) · every advance gated on drain ·
   taps mid-speech register + score at once · voice OFF releases
   gates instantly · per-utterance watchdog 1.8s + 0.62s/word (4–25s). */
let voice = null;
function pickVoice() {
  const vs = (window.speechSynthesis ? speechSynthesis.getVoices() : []);
  if (!vs.length) return null;
  return vs.find(v => /google us english/i.test(v.name))
      || vs.find(v => /natural|neural/i.test(v.name) && /^en/i.test(v.lang))
      || vs.find(v => /premium|enhanced/i.test(v.name) && /^en/i.test(v.lang))
      || vs.find(v => v.lang === 'en-US')
      || vs.find(v => v.lang === 'en-GB')
      || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { voice = pickVoice(); speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); }; }

const sq = []; let speakingNow = false, curFinish = null;
let drainWaiters = [];
window.__speech = { get speaking() { return speakingNow; }, get queued() { return sq.length; } };

function speak(text, mood) {
  return new Promise(res => {
    if (!voiceOn || !('speechSynthesis' in window)) { res(); return; }
    sq.push({ text, mood: mood || 'calm', res });
    pump();
  });
}
const PITCH = { calm: 1.05, happy: 1.15, praise: 1.28, question: 1.1, kind: 1.0 };
function pump() {
  if (speakingNow) return;
  const item = sq.shift();
  if (!item) { checkDrain(); return; }
  speakingNow = true; hostframe.classList.add('speaking');
  const u = new SpeechSynthesisUtterance(item.text);
  u.rate = RATE; u.pitch = PITCH[item.mood] || 1.05;
  if (voice) u.voice = voice;
  const words = item.text.trim().split(/\s+/).length;
  const wd = Math.min(25, Math.max(4, 1.8 + 0.62 * words));
  let done = false;
  const finish = () => {
    if (done) return; done = true;
    clearTimeout(timer); speakingNow = false; curFinish = null;
    hostframe.classList.remove('speaking');
    item.res(); pump();
  };
  const timer = setTimeout(finish, wd * 1000);   /* watchdog release */
  curFinish = finish;
  u.onend = finish; u.onerror = finish;
  try { speechSynthesis.speak(u); } catch (e) { finish(); }
}
function speechIdle() {
  return new Promise(res => {
    if (!speakingNow && sq.length === 0) res();
    else drainWaiters.push(res);
  });
}
function checkDrain() {
  if (!speakingNow && sq.length === 0 && drainWaiters.length) {
    const w = drainWaiters.splice(0); w.forEach(r => r());
  }
}
function flushSpeech() {           /* voice toggled OFF: release everything now */
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
  while (sq.length) { const it = sq.shift(); it.res(); }
  if (curFinish) { const f = curFinish; curFinish = null; f(); }
  speakingNow = false; hostframe.classList.remove('speaking');
  checkDrain();
}

/* ================= MUSIC (WebAudio, no files) ================= */
let actx = null, musicTimer = null, noteIdx = 0;
const MELODY = [523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 440.0];
function playNote() {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = MELODY[noteIdx++ % MELODY.length];
  g.gain.setValueAtTime(0.055, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.42);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.45);
}
function startMusic() {
  if (!musicOn) return;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (actx.state === 'suspended') actx.resume();
  if (!musicTimer) musicTimer = setInterval(playNote, 460);
}
function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }
function fanfare() {
  if (!actx) return;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    const t = actx.currentTime + i * 0.16;
    g.gain.setValueAtTime(0.09, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.55);
  });
}

$('#musicTgl').addEventListener('click', e => {
  musicOn = !musicOn; e.currentTarget.classList.toggle('off', !musicOn);
  if (musicOn) startMusic(); else stopMusic();
});
$('#voiceTgl').addEventListener('click', e => {
  voiceOn = !voiceOn; e.currentTarget.classList.toggle('off', !voiceOn);
  if (!voiceOn) flushSpeech();
});

/* ================= SHARED ANSWER FLOW ================= */
const PRAISE = ['Well done!', 'Great job!', 'Wonderful!', 'Super work!', 'Yes! That is right!', 'Brilliant!'];
const RETRY  = ['Good try! Try again.', 'Almost! Have another look.', 'You can do it! Try once more.'];
const pick = a => a[Math.floor(Math.random() * a.length)];

function wireAnswers(container, onCorrect) {
  let locked = false;
  container.addEventListener('click', async ev => {
    const btn = ev.target.closest('[data-a]');
    if (!btn || locked) return;
    if (btn.dataset.a === '1') {
      locked = true;
      score++; updateScore();
      btn.classList.add('right'); starBurst(btn); gesture('cheer');
      speak(pick(PRAISE), 'praise'); speak('You get one star!', 'happy');
      container.querySelectorAll('[data-a]').forEach(b => b.style.pointerEvents = 'none');
      await speechIdle();
      onCorrect();
    } else {
      if (btn.dataset.tried) return;
      btn.dataset.tried = '1';
      btn.classList.add('wrong'); gesture('nod');
      speak(pick(RETRY), 'kind');
    }
  });
}

/* ================= STAGE RUNNER ================= */
let stageIdx = -1;
function nextStage() {
  stageIdx++;
  if (stageIdx < DATA.stages.length) runStage(DATA.stages[stageIdx], stageIdx + 1);
  else if (stageIdx === DATA.stages.length && DATA.quiz.length) stageQuiz(0);
  else stageEnd();
}
function runStage(st, barIdx) {
  setStage(barIdx);
  if (st.kind === 'choice') choiceRound(st, 0);
  else if (st.kind === 'sort') sortRound(st, 0);
  else if (st.kind === 'picture') pictureRound(st, 0);
  else if (st.kind === 'order') orderStage(st);
}

/* ---- choice rounds (hunt / fill / match) ---- */
function choiceRound(st, i) {
  const r = st.rounds[i];
  setBubble(r.say);
  gesture('nod');
  speak(r.say, 'question');
  const shown = r.shown ? `<div class="showntext">${r.shown}</div>` : '';
  let inner = '';
  if (st.variant === 'opts') {
    inner = `<div class="opts2" id="opts">${r.opts.map((o, j) =>
      `<button class="optbtn" data-a="${j === r.key ? 1 : 0}"><b>${'ABCD'[j]})</b>${o.t}</button>`).join('')}</div>`;
  } else {
    inner = `<div class="chips" id="opts">${r.opts.map((o, j) =>
      `<button class="wcard${o.img ? '' : ' nopic'}" data-a="${j === r.key ? 1 : 0}">${o.img ? `<span class="pic"><img src="${o.img}" alt=""></span>` : ''}<span class="w">${o.t}</span></button>`).join('')}</div>`;
  }
  panel.innerHTML = shown + inner;
  wireAnswers($('#opts'), () => { i + 1 < st.rounds.length ? choiceRound(st, i + 1) : nextStage(); });
}

/* ---- sorting ---- */
function sortRound(st, i) {
  const it = st.items[i];
  setBubble(`Sorting Game! Where does "${it.w}" go?`);
  speak(`Where does ${it.w} go?`, 'question');
  panel.innerHTML = `
    <div class="sortcard"><span class="bigword">${it.w}</span></div>
    <div class="boxes" id="opts">${st.groups.map(g =>
      `<button class="sbox" data-a="${g.id === it.g ? 1 : 0}" style="background:${g.color}; border-color:${g.color}">${g.shape} ${g.label}<small>tap the right box</small></button>`).join('')}</div>`;
  wireAnswers($('#opts'), () => { i + 1 < st.items.length ? sortRound(st, i + 1) : nextStage(); });
}

/* ---- picture words ---- */
function pictureRound(st, i) {
  const r = st.rounds[i];
  setBubble(r.say);
  gesture('nod');
  speak(r.say, 'question');
  panel.innerHTML = `
    <div class="scenewrap"><img src="${st.img}" alt="Picture"></div>
    <div class="chips" id="opts">${r.opts.map((o, j) =>
      `<button class="wcard nopic" data-a="${j === r.key ? 1 : 0}" style="max-width:170px"><span class="w">${o.t}</span></button>`).join('')}</div>`;
  wireAnswers($('#opts'), () => { i + 1 < st.rounds.length ? pictureRound(st, i + 1) : nextStage(); });
}

/* ---- put in order ---- */
function orderStage(st) {
  let next = 0;
  setBubble(st.say);
  gesture('nod');
  speak(st.say, 'question');
  panel.innerHTML = `
    <div class="orderstrip" id="strip"><span class="hint">Your answer grows here…</span></div>
    <div class="chips" id="opts">${st.shuffled.map(txt =>
      `<button class="ochip" data-w="${txt.replace(/"/g, '&quot;')}">${txt}</button>`).join('')}</div>`;
  const strip = $('#strip'), opts = $('#opts');
  opts.addEventListener('click', async ev => {
    const btn = ev.target.closest('.ochip');
    if (!btn || btn.classList.contains('placed')) return;
    if (btn.dataset.w === st.items[next]) {
      btn.classList.add('placed');
      score++; updateScore(); starBurst(btn); gesture('cheer');
      const ph = document.createElement('span');
      ph.className = 'placed'; ph.textContent = btn.dataset.w;
      const hint = strip.querySelector('.hint'); if (hint) hint.remove();
      strip.appendChild(ph);
      next++;
      speak(pick(PRAISE), 'praise');
      if (next >= st.items.length) {
        opts.querySelectorAll('.ochip').forEach(b => b.style.pointerEvents = 'none');
        await speechIdle();
        nextStage();
      }
    } else {
      if (btn.dataset.tried) return;
      btn.dataset.tried = '1';
      btn.classList.add('wrong'); gesture('nod');
      speak(pick(RETRY), 'kind');
    }
  });
}

/* ---- Miss Zara Asks: the printed quiz, verbatim ---- */
function stageQuiz(i) {
  setStage(DATA.stages.length + 1);
  const it = DATA.quiz[i];
  setBubble(`Question ${i + 1}. ${it.q}`);
  gesture('nod');
  speak(`Question ${i + 1}. ${it.q.replace('…', '')}`, 'question');
  panel.innerHTML = `
    <div class="qtext"><span class="qnum">${i + 1}</span>${it.q}</div>
    <div class="opts2" id="opts">${it.opts.map((o, j) =>
      `<button class="optbtn" data-a="${j === it.key ? 1 : 0}"><b>${'ABCD'[j]})</b>${o}</button>`).join('')}</div>`;
  wireAnswers($('#opts'), () => { i + 1 < DATA.quiz.length ? stageQuiz(i + 1) : nextStage(); });
}

/* ---- start + end ---- */
function stageStart() {
  setStage(0);
  panel.innerHTML = `
    <div class="center">
      <div class="startart"><img class="z" src="img/zara.jpg" alt="Miss Zara"><img class="k" src="img/kids.jpg" alt="Omar and Lily"></div>
      <h2 style="font-size:26px; margin:8px 0 4px;">Hello! I am Miss Zara.</h2>
      <p style="font-size:18px; margin-bottom:14px;">Let's play the <b>${DATA.topicName}</b> game with Omar and Lily!</p>
      <button class="bigbtn" id="startbtn">▶ Start</button>
    </div>`;
  $('#startbtn').addEventListener('click', async () => {
    startMusic();
    $('#hostrow').style.display = 'flex';
    const sb = $('#startbtn'); if (sb) sb.remove();
    setBubble('Hello, children! ' + DATA.coreLine);
    gesture('wave');
    speak('Hello, children!', 'happy');
    speak(DATA.coreLine, 'calm');
    panel.innerHTML = `<div class="center"><p style="font-size:19px; margin-bottom:14px;">Listen to Miss Zara… then tap the button!</p>
      <button class="bigbtn dim" id="playbtn">Let's Play! 🎮</button></div>`;
    await speechIdle();
    const pb = $('#playbtn');
    pb.classList.remove('dim');
    pb.addEventListener('click', () => nextStage());
  });
}
function stageEnd() {
  setStage(DATA.stages.length + (DATA.quiz.length ? 2 : 1));
  const frac = score / MAXSCORE;
  const stars = frac >= 0.8 ? 3 : frac >= 0.5 ? 2 : 1;
  setBubble(DATA.outcome);
  gesture('cheer');
  speak(DATA.outcome, 'praise');
  fanfare();
  panel.innerHTML = `
    <div class="center">
      <div class="startart"><img class="z" src="img/zara.jpg" alt="Miss Zara"><img class="k" src="img/kids.jpg" alt="Omar and Lily"></div>
      <div class="endstars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
      <div class="endscore" id="finalscore">You scored ${score} out of ${MAXSCORE}!</div>
      <div class="endline">${DATA.outcome}</div>
      <p style="font-size:17px; margin:10px 0 16px;">${DATA.coreLine}</p>
      <button class="bigbtn" onclick="location.reload()">↻ Play Again</button>
    </div>`;
}
stageStart();
</script>
